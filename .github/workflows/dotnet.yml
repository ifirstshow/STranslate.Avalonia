name: Public STranslate

# https://github.com/softprops/action-gh-release/issues/236#issuecomment-1150530128
# 无需 Token 即可发布
permissions:
  contents: write


on:
  release:
    types: [published]
  push:
    tags:
      - "*" # Push events to matching *, i.e. 1.0, 20.15.10
  workflow_dispatch:

jobs:
  # ⚠ 暂停：GitHub Windows runner 上 NuGet RestoreTask 间歇性静默失败（MSB4181），
  # 已排查 SDK 版本/审计/静态图/workload resolver/离线源/缓存/镜像均未命中；
  # Windows 产物目前用本地 publish-avalonia.ps1 -Version x -Upload 发布。runner 更新后删掉下行 if 重启用。
  avalonia:
    if: false

    runs-on: windows-2025 # Native AOT 需要 MSVC link.exe，runner 自带 VS

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.303'

    - name: Install vpk
      run: dotnet tool install -g vpk

    - name: Build and Pack Avalonia
      shell: pwsh
      env:
        VERSION: ${{ github.ref_name }}
      run: pwsh -File ./publish-avalonia.ps1 -Version $env:VERSION

    - name: Release Avalonia
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ github.ref_name }}
        draft: false
        files: |
          Releases/*

    - name: Upload restore binlogs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: restore-binlogs
        path: |
          restore-worker.binlog
          restore-worker-verbose.binlog
        if-no-files-found: ignore

  crosscompile:
    runs-on: ubuntu-latest # 跨平台可编译性校验（不出产物交付）

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.303'

    - name: Cross-compile check
      run: dotnet build src/STranslate.Avalonia/STranslate.Avalonia.csproj -p:TargetFrameworks=net10.0
